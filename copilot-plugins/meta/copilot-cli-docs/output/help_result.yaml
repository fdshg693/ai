version: GitHub Copilot CLI 1.0.68.
usage: copilot [options] [command]
description: GitHub Copilot CLI - An AI-powered coding assistant. Start an interactive session to chat with Copilot, or use -p/--prompt for non-interactive scripting. Copilot can edit files, run shell commands, search your codebase, and more — all with configurable permissions. Run `copilot <command> --help` for details on any subcommand.
options:
- name: --acp
  description: Start as Agent Client Protocol server
- name: --add-dir <directory>
  description: Add a directory to the allowed list for file access (can be used multiple times)
- name: --add-github-mcp-tool <tool>
  description: Add a tool to enable for the GitHub MCP server instead of the default CLI subset (can be used multiple times). Use "*" for all tools.
- name: --add-github-mcp-toolset <toolset>
  description: Add a toolset to enable for the GitHub MCP server instead of the default CLI subset (can be used multiple times). Use "all" for all toolsets.
- name: --additional-mcp-config <json>
  description: Additional MCP servers configuration as JSON string or file path (prefix with @) (can be used multiple times; augments config from ~/.copilot/mcp-config.json for this session)
- name: --agent <agent>
  description: Specify a custom agent to use
- name: --allow-all
  description: Enable all permissions (equivalent to --allow-all-tools --allow-all-paths --allow-all-urls)
- name: --allow-all-mcp-server-instructions
  description: Include initialization instructions from all MCP servers in the system prompt instead of only allowlisted servers
- name: --allow-all-paths
  description: Disable file path verification and allow access to any path
- name: --allow-all-tools
  description: 'Allow all tools to run automatically without confirmation; required for non-interactive mode (env: COPILOT_ALLOW_ALL)'
- name: --allow-all-urls
  description: Allow access to all URLs without confirmation
- name: --allow-tool[=tools...]
  description: Tools the CLI has permission to use; will not prompt for permission
- name: --allow-url[=urls...]
  description: Allow access to specific URLs or domains
- name: --attachment <path>
  description: Attach a file (image or native document) to the initial prompt; only valid in non-interactive mode (can be used multiple times)
- name: --autopilot
  description: Start in autopilot mode
- name: --available-tools[=tools...]
  description: Only these tools will be available to the model
- name: --banner
  description: Show the startup banner
- name: --bash-env[=value]
  description: Enable BASH_ENV support for bash shells (on|off)
- name: -C <directory>
  description: Change working directory before doing anything else
- name: --connect[=sessionId]
  description: Connect directly to a remote session (optionally specify session ID or task ID)
- name: --context <tier>
  description: 'Set the context window tier (overrides persisted setting) (choices: "default", "long_context")'
- name: --continue
  description: Resume the most recent session
- name: --deny-tool[=tools...]
  description: Tools the CLI does not have permission to use; will not prompt for permission
- name: --deny-url[=urls...]
  description: Deny access to specific URLs or domains, takes precedence over --allow-url
- name: --disable-builtin-mcps
  description: 'Disable all built-in MCP servers (currently: github-mcp-server)'
- name: --disable-mcp-server <server-name>
  description: Disable a specific MCP server (can be used multiple times)
- name: --disallow-temp-dir
  description: Prevent automatic access to the system temporary directory
- name: --effort, --reasoning-effort <level>
  description: 'Set the reasoning effort level (choices: "none", "low", "medium", "high", "xhigh", "max")'
- name: --enable-all-github-mcp-tools
  description: Enable all GitHub MCP server tools instead of the default CLI subset. Overrides --add-github-mcp-toolset and --add-github-mcp-tool options.
- name: --enable-memory
  description: Enable memory in prompt mode (disabled by default)
- name: --enable-reasoning-summaries
  description: Request reasoning summaries for OpenAI models
- name: --excluded-tools[=tools...]
  description: These tools will not be available to the model
- name: --experimental
  description: Enable experimental features
- name: --extension-sdk-path <directory>
  description: Override the bundled @github/copilot-sdk injected into extension subprocesses with a local `copilot-sdk/` folder. Invalid paths fall back to the bundled SDK.
- name: -h, --help
  description: display help for command
- name: -i, --interactive <prompt>
  description: Start interactive mode and automatically execute this prompt
- name: --log-dir <directory>
  description: 'Set log file directory (default: ~/.copilot/logs/)'
- name: --log-level <level>
  description: 'Set the log level (choices: "none", "error", "warning", "info", "debug", "all", "default")'
- name: --max-ai-credits <credits>
  description: Set max AI credits for this session
- name: --max-autopilot-continues <count>
  description: 'Maximum number of continuation messages in autopilot mode (default: 5)'
- name: --mode <mode>
  description: 'Set the initial agent mode (choices: "interactive", "plan", "autopilot")'
- name: --model <model>
  description: Set the AI model to use (use 'auto' to let Copilot pick automatically)
- name: --mouse[=value]
  description: Enable mouse support in alt screen mode (on|off)
- name: -n, --name <name>
  description: Set a name for the new session
- name: --no-ask-user
  description: Disable the ask_user tool (agent works autonomously without asking questions)
- name: --no-auto-update
  description: Disable downloading CLI update automatically (disabled by default in CI environments)
- name: --no-bash-env
  description: Disable BASH_ENV support for bash shells
- name: --no-color
  description: Disable all color output
- name: --no-custom-instructions
  description: Disable loading of custom instructions from AGENTS.md and related files
- name: --no-experimental
  description: Disable experimental features
- name: --no-mouse
  description: Disable mouse support in alt screen mode
- name: --no-remote
  description: Disable remote control of your session from GitHub web and mobile
- name: --no-remote-export
  description: Disable exporting your session to GitHub web and mobile (also disables remote control)
- name: --output-format <format>
  description: 'Output format: ''text'' (default) or ''json'' (JSONL, one JSON object per line) (choices: "text", "json")'
- name: -p, --prompt <text>
  description: Execute a prompt in non-interactive mode (exits after completion)
- name: --plain-diff
  description: Disable rich diff rendering (syntax highlighting via diff tool specified by git config)
- name: --plan
  description: Start in plan mode
- name: --plugin-dir <directory>
  description: Load a plugin from a local directory (can be used multiple times)
- name: -r, --resume[=value]
  description: Resume from a previous session (optionally specify existing session ID, task ID, ID prefix, or name; name matching is exact, case-insensitive)
- name: --remote
  description: Enable remote control of your session from GitHub web and mobile
- name: --remote-export
  description: Export your session to GitHub web and mobile (read-only; does not enable remote control)
- name: -s, --silent
  description: Output only the agent response (no stats), useful for scripting with -p
- name: --screen-reader
  description: Enable screen reader optimizations
- name: --secret-env-vars[=vars...]
  description: Environment variable names whose values are stripped from shell and MCP server environments and redacted from output (e.g., --secret-env-vars=MY_KEY,OTHER_KEY)
- name: --session-id <id>
  description: Resume an existing session or task by ID, or set the UUID for a new session
- name: --share[=path]
  description: 'Share session to markdown file after completion in non-interactive mode (default: ./copilot-session-<id>.md)'
- name: --share-gist
  description: Share session to a secret GitHub gist after completion in non-interactive mode
- name: --stream <mode>
  description: 'Enable or disable streaming mode (choices: "on", "off")'
- name: -v, --version
  description: show version information
- name: --yolo
  description: Enable all permissions (equivalent to --allow-all-tools --allow-all-paths --allow-all-urls)
commands:
- name: completion <shell>
  description: Generate a shell completion script
- name: help [topic]
  description: Display help information
- name: init
  description: Initialize Copilot instructions
- name: login [options]
  description: Authenticate with Copilot
- name: mcp
  description: Manage MCP servers
- name: plugin
  description: Manage plugins
- name: skill
  description: Manage skills
- name: update [channel]
  description: Download the latest version
- name: version
  description: Display version information
help_topics:
- name: billing
  description: AI credit usage
- name: commands
  description: Interactive Mode Commands
- name: config
  description: Configuration Settings
- name: environment
  description: Environment Variables
- name: limits
  description: Session Limits Controls
- name: logging
  description: Logging
- name: monitoring
  description: Monitoring with OpenTelemetry
- name: permissions
  description: Permissions
- name: providers
  description: Custom Model Providers (BYOK)
examples:
- description: Start interactive mode
  commands:
  - copilot
- description: Start interactive mode and automatically execute a prompt
  commands:
  - copilot -i "Fix the bug in main.js"
- description: Execute a prompt in non-interactive mode (exits after completion)
  commands:
  - copilot -p "Fix the bug in main.js" --allow-all-tools
- description: Enable all permissions with a single flag
  commands:
  - copilot -p "Fix the bug in main.js" --allow-all
  - copilot -p "Fix the bug in main.js" --yolo
- description: Start with a specific model
  commands:
  - copilot --model gpt-5.4
- description: Resume the most recent session
  commands:
  - copilot --continue
- description: Resume a previous session using session picker
  commands:
  - copilot --resume
- description: Resume a specific session by ID
  commands:
  - copilot --resume=<session-id>
- description: Name a new session
  commands:
  - copilot --name="my feature"
- description: Start a new session with a specific UUID
  commands:
  - copilot --session-id=0cb916db-26aa-40f2-86b5-1ba81b225fd2
- description: Resume or attach to an existing session or task by ID
  commands:
  - copilot --session-id=<session-or-task-id>
- description: Resume a session by name
  commands:
  - copilot --resume="my feature"
- description: Resume a session by ID prefix (7+ hex chars)
  commands:
  - copilot --resume=0cb916d
- description: Resume with auto-approval
  commands:
  - copilot --allow-all-tools --resume
- description: Allow access to additional directory
  commands:
  - copilot --add-dir /home/user/projects
- description: Allow multiple directories
  commands:
  - copilot --add-dir ~/workspace --add-dir /tmp
- description: Disable path verification (allow access to any path)
  commands:
  - copilot --allow-all-paths
- description: Allow all git commands except git push
  commands:
  - copilot --allow-tool='shell(git:*)' --deny-tool='shell(git push)'
- description: Allow all file editing
  commands:
  - copilot --allow-tool='write'
- description: Allow all but one specific tool from MCP server with name "MyMCP"
  commands:
  - copilot --deny-tool='MyMCP(denied_tool)' --allow-tool='MyMCP'
- description: Allow GitHub API access (defaults to HTTPS)
  commands:
  - copilot --allow-url=github.com
- description: Deny access to specific domain over HTTPS
  commands:
  - copilot --deny-url=https://malicious-site.com
  - copilot --deny-url=malicious-site.com
- description: Allow all URLs without confirmation
  commands:
  - copilot --allow-all-urls
- description: Initialize Copilot instructions for a repository
  commands:
  - copilot init
learn_more: Use `copilot <command> --help` for more information about a command. Read the documentation at https://docs.github.com/copilot/how-tos/copilot-cli
