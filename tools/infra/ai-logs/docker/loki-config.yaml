auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# 保持（retention）はここだけで行う。table_manager は schema v13 tsdb では非推奨なので使わない。
compactor:
  # volume `loki-data` は /loki にマウントされる。marker をコンテナ再作成で失わないよう volume 内に置く
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  # 公式サンプルの 150 は 1コア/1GB の VM には過大
  retention_delete_worker_count: 4
  # object_store が filesystem のときは filesystem を指定する（`shared_store` は 3.5 系に無い）
  delete_request_store: filesystem

limits_config:
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  # ホットは 14 日。これより古い分は Azure Blob のアーカイブ（just archive-pull）で見る。
  # `reject_old_samples_max_age` は「古いサンプルの取り込み拒否」であり保持期間ではない（別物）
  retention_period: 336h
  max_query_lookback: 336h
