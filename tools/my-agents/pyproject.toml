[project]
name = "my-agents"
version = "0.1.2"
description = "YAML定義で組み立てる、Langchain製のカスタムエージェント群"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-openai",
    "python-dotenv",
    "pyyaml",
    "pydantic>=2",
    "typer>=0.12",
    "tzdata; sys_platform == 'win32'",
    "mslearn-cli",
    "tav-cli",
]

[project.scripts]
my-agents = "my_agents.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["my_agents*"]

[tool.uv.sources]
mslearn-cli = { workspace = true }
tav-cli = { workspace = true }
