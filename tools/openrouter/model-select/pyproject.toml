[project]
name = "model-select"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "jinja2",
]

[project.scripts]
model-select = "model_select.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["model_select"]
