[project]
name = "ai-usage-cli"
version = "0.1.0"
description = "Terminal CLI showing rate-limit usage across Claude Code and Codex"
requires-python = ">=3.11"
dependencies = [
    "pywinpty>=2.0; sys_platform == 'win32'",
    "pyte>=0.8; sys_platform == 'win32'",
]

[project.scripts]
ai-usage = "ai_usage_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ai_usage_cli"]
packages = ["ai_usage_core", "ai_usage_core.collectors"]
