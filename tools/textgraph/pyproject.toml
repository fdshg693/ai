[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "textgraph"
version = "0.1.1"
description = "Local file-link graph for text files"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
textgraph = "textgraph.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["textgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
