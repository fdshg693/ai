[project]
name = "aim-cli"
version = "0.1.9"
requires-python = ">=3.11"
dependencies = [
    "openrouter",
    "python-dotenv",
]

[project.scripts]
aim = "aim_cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["aim_cli", "aim_at", "aim_files", "aim_parallel", "aim_pricing"]
