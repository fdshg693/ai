arguments: []
options:
- name: -j, --json
  description: 'Output in JSON format (default: false)'
- name: -s, --since <since>
  description: Filter from date (YYYY-MM-DD or YYYYMMDD)
- name: -u, --until <until>
  description: Filter until date (inclusive)
- name: -z, --timezone <timezone>
  description: Timezone for date grouping (IANA)
- name: --all
  description: 'Accepted for compatibility; all detected supported agents are included by default (default: false)'
- name: --sections <sections>
