services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: claude-code-debugging-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:13133:13133" # health_check
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - loki

  loki:
    image: grafana/loki:3.5.0
    container_name: claude-code-debugging-otel-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"   # Loki HTTP API を直接クエリするため、ai-logsと違いホストに公開する
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: claude-code-debugging-otel-grafana
    env_file:
      - .env   # GRAFANA_ADMIN_PASSWORD=<任意のパスワード>。.gitignore対象
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  loki-data:
  grafana-data:
