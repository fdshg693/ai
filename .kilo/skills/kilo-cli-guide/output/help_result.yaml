version: "7.6.2"
fetched_at: "2026-09-16T02:32:57.617428+00:00"
source: "kilo --help"
commands:
  - name: "kilo completion"
    description: "generate shell completion script"
  - name: "kilo acp"
    description: "start ACP (Agent Client Protocol) server"
  - name: "kilo mcp"
    description: "manage MCP (Model Context Protocol) servers"
  - name: "kilo [project]"
    description: "start kilo tui                                                  [default]"
  - name: "kilo attach <url>"
    description: "attach to a running kilo server"
  - name: "kilo run [message..]"
    description: "run kilo with a message"
  - name: "kilo debug"
    description: "debugging and troubleshooting tools"
  - name: "kilo auth"
    description: "manage AI providers and credentials                  [aliases: providers]"
  - name: "kilo agent"
    description: "manage agents"
  - name: "kilo upgrade [target]"
    description: "upgrade kilo to the latest or a specific version"
  - name: "kilo uninstall"
    description: "uninstall kilo and remove all related files"
  - name: "kilo serve"
    description: "starts a headless kilo server"
  - name: "kilo models [provider]"
    description: "list all available models"
  - name: "kilo stats"
    description: "show token usage and cost statistics"
  - name: "kilo export [sessionID]"
    description: "export session data as JSON"
  - name: "kilo import <file>"
    description: "import session data from JSON file or URL"
  - name: "kilo github"
    description: "manage GitHub agent"
  - name: "kilo pr"
    description: "manage pull requests"
  - name: "kilo session"
    description: "manage sessions"
  - name: "kilo plugin <module>"
    description: "install plugin and update config                          [aliases: plug]"
  - name: "kilo db"
    description: "database tools"
  - name: "kilo console"
    description: "open or stop the local Kilo Console (deprecated)"
  - name: "kilo cloud"
    description: "run Cloud Agent tasks"
  - name: "kilo roll-call <filter>"
    description: "batch-test text models matching a filter for connectivity and latency"
  - name: "kilo profile"
    description: "show Kilo account profile"
  - name: "kilo remote"
    description: "enable remote connection for real-time session relay"
  - name: "kilo daemon"
    description: "manage the local kilo daemon"
  - name: "kilo config"
    description: "configuration tools"
  - name: "kilo worktree"
    description: "manage git worktrees"
  - name: "kilo help [command]"
    description: "show full CLI reference"
positionals:
  - name: "project"
    description: "path to start kilo in                                                            [string]"
options:
  - name: "-h, --help"
    description: "show help                                                            [boolean]"
  - name: "-v, --version"
    description: "show version number                                                  [boolean]"
  - name: "--print-logs"
    description: "print logs to stderr                                                 [boolean]"
  - name: "--log-level"
    description: "log level                 [string] [choices: \"DEBUG\", \"INFO\", \"WARN\", \"ERROR\"]"
  - name: "--pure"
    description: "run without external plugins                                         [boolean]"
  - name: "--port"
    description: "port to listen on                                        [number] [default: 0]"
  - name: "--hostname"
    description: "hostname to listen on                          [string] [default: \"127.0.0.1\"]"
  - name: "--mdns"
    description: "enable mDNS service discovery (defaults hostname to 0.0.0.0) [boolean] [default: false]"
  - name: "--mdns-domain"
    description: "custom domain name for mDNS service (default: kilo.local) [string] [default: \"kilo.local\"]"
  - name: "--cors"
    description: "additional domains to allow for CORS                     [array] [default: []]"
  - name: "-m, --model"
    description: "model to use in the format of provider/model                          [string]"
  - name: "-c, --continue"
    description: "continue the last session                                            [boolean]"
  - name: "-s, --session"
    description: "session id to continue                                                [string]"
  - name: "--fork"
    description: "fork the session when continuing (use with --continue or --session)  [boolean]"
  - name: "--cloud-fork"
    description: "fetch session from cloud and continue locally (use with --session)   [boolean]"
  - name: "--worktree"
    description: "create (or reuse) a git worktree with this name and start kilo there  [string]"
  - name: "--prompt"
    description: "prompt to use                                                         [string]"
  - name: "--agent"
    description: "agent to use                                                          [string]"
  - name: "--auto"
    description: "auto-approve permissions that are not explicitly denied (dangerous!) [boolean] [default: false]"
  - name: "--mini"
    description: "start the minimal interactive interface             [boolean] [default: false]"
  - name: "--no-replay"
    description: "disable mini session history replay on resume and after resize       [boolean]"
  - name: "--replay-limit"
    description: "cap visible mini replay to the newest N messages                      [number]"
