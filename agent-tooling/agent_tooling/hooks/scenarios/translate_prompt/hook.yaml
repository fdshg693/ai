# Hook definition read by build/build.py and aggregated into generated/catalog.json.
# Keys are documented in ../../AGENTS.md ("hook.yaml"). Do not write command strings
# here: the installer builds them from the install location.
# Claude Code only: the source is adapters/claude/translate_prompt.py (shared helpers in adapters/claude/common/).
id: translate_prompt
description: 送信されたプロンプトを aim CLI で英訳し、additionalContext として付加する
distributable: true
requires_tools: [aim]
agents:
  claude:
    registrations:
      - event: UserPromptSubmit
        timeout: 60
