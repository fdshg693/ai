# Hook definition read by build/build.py and aggregated into generated/catalog.json.
# Keys are documented in ../../AGENTS.md ("hook.yaml"). Do not write command strings
# here: the installer builds them from the install location.
# Claude Code only: the source is adapters/claude/stop_alert.py (shared helpers in adapters/claude/common/).
id: stop_alert
description: 応答完了（Stop）時に Windows でアラート音と画面右下のポップアップ通知を出す
distributable: true
agents:
  claude:
    registrations:
      - event: Stop
        timeout: 15
