# Hook definition read by build/build.py and aggregated into generated/catalog.json.
# Keys are documented in ../../AGENTS.md ("hook.yaml"). Do not write command strings
# here: the installer builds them from the install location.
# Claude Code only: the source is adapters/claude/block_large_read.py (shared helpers in adapters/claude/common/).
id: block_large_read
description: 閾値を超える巨大ファイルの Read をブロックし、サブエージェントへの委譲を促す
distributable: true
agents:
  claude:
    registrations:
      - event: PreToolUse
        matcher: Read
