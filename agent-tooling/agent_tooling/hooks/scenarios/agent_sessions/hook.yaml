# Hook definition read by build/build.py and aggregated into generated/catalog.json.
# Keys are documented in ../../AGENTS.md ("hook.yaml"). Do not write command strings
# here: the installer builds them from the install location.
id: agent_sessions
description: AIエージェントのセッション開始/終了/CWD変更をユーザー単位のセッションレジストリへ反映する（注入しない）
distributable: true
agents:
  claude:
    registrations:
      - event: SessionStart
        matcher: "*"
      # CwdChanged does not support matchers.
      - event: CwdChanged
      - event: SessionEnd
        matcher: "*"
  codex:
    registrations:
      - event: SessionStart
        statusMessage: Registering agent session
      - event: SessionEnd
        statusMessage: Removing agent session
  cursor:
    registrations:
      - event: sessionStart
      - event: sessionEnd
  antigravity:
    registrations:
      - event: PreToolUse
        matcher: run_command
      - event: PreInvocation
      - event: Stop
  kilo: {}
