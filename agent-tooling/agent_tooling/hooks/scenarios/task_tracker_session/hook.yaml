# Hook definition read by build/build.py and aggregated into generated/catalog.json.
# Keys are documented in ../../AGENTS.md ("hook.yaml"). Do not write command strings
# here: the installer builds them from the install location.
# Claude Code only: the source is adapters/claude/task_tracker_session.py (shared helpers in adapters/claude/common/).
id: task_tracker_session
description: /task-tracker <task-name> 実行時にタスク用ディレクトリを作り、セッションIDを sessions.md へ記録する
distributable: true
agents:
  claude:
    registrations:
      - event: UserPromptExpansion
        matcher: ^task-tracker$
