# inject_env_vars.py (PreToolUse hook。このファイルは <フック配置先>/config/ に置く) が、
# Bash/PowerShellの実行前にここで定義した環境変数を export / $env: としてコマンド先頭に注入する。
# ユーザーが毎回 `source` する手間をなくすための仕組み。詳細は配置された
# inject_env_vars.py のモジュールdocstringを参照。
#
# サポートするのは以下のサブセットのみ（フルのYAMLではない。pyyaml依存を避け、
# 毎回のコマンド実行前でも即座に起動できるようにするため）:
#   - トップレベルキーは `override` と `vars` の2つのみ
#   - `vars` のネストは1階層のみ（リスト・複数行文字列・アンカー等は非対応）
#   - `key: value` は必ずコロンの後にスペースを1つ入れる
#     （値に `:` を含めても、この形式を守っていれば問題なくパースされる）
#   - 値は無クォート・シングルクォート・ダブルクォートのいずれでもよい（クォートは剥がされる）
#   - 重複キー（`vars` 内、および `override`/`vars` 自体）は後に書かれた方が勝つ

# 既存の環境変数（プロセスに既に設定済みの値）を上書きするかどうかのグローバル設定。
# false（省略時のデフォルト）なら、既に設定済みのキーには注入しない（既存の値を尊重する）。
# true なら既存の値があっても常に `vars` の値で上書きする。
override: false

vars:
  # 直接値を書けばそのままリテラル値として注入される。
  # EXAMPLE_VAR: literal-value

  # "@" + 相対パス（このファイルからの相対パス）を書くと、そのパスにある
  # .env形式ファイル（KEY=VALUE形式。ファイル名は .env でなくてもよい）から
  # 「同じキー名」の行を探して値を読み込む。別名のキーへのマッピングは不可
  # （参照先ファイル側もこのファイルと同じキー名で書くこと）。例えば下記は
  # ./secrets/local.env 内の `OPENAI_API_KEY=...` 行の値を読み込む。
  # OPENAI_API_KEY: "@secrets/local.env"
  #
  # 参照先ファイル・キーが見つからない場合はそのキーの注入だけがスキップされ、
  # コマンド自体はブロックされない（fail-open）。警告は systemMessage 経由で表示される。
  #
  # このファイル自体はコミットされる前提のため、秘密の値は直接書かず `@`参照で
  # 外だしすること。リポジトリのルート .gitignore は `*.env` を無視しているため、
  # 参照先ファイル名を `*.env` にしておけば自動的にコミット対象外になる。
