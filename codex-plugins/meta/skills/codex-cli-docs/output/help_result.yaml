version: codex-cli 0.143.0
fetched_at: '2026-07-08T14:25:47.240705+00:00'
usage:
- codex [OPTIONS] [PROMPT]
- codex [OPTIONS] <COMMAND> [ARGS]
description: Codex CLI If no subcommand is specified, options will be forwarded to the interactive CLI.
commands:
- name: exec
  description: 'Run Codex non-interactively [aliases: e]'
- name: review
  description: Run a code review non-interactively
- name: login
  description: Manage login
- name: logout
  description: Remove stored authentication credentials
- name: mcp
  description: Manage external MCP servers for Codex
- name: plugin
  description: Manage Codex plugins
- name: mcp-server
  description: Start Codex as an MCP server (stdio)
- name: app-server
  description: '[experimental] Run the app server or related tooling'
- name: remote-control
  description: '[experimental] Manage the app-server daemon with remote control enabled'
- name: app
  description: Launch the Codex desktop app (opens the app installer if missing)
- name: completion
  description: Generate shell completion scripts
- name: update
  description: Update Codex to the latest version
- name: doctor
  description: Diagnose local Codex installation, config, auth, and runtime health
- name: sandbox
  description: Run commands within a Codex-provided sandbox
- name: debug
  description: Debugging tools
- name: apply
  description: 'Apply the latest diff produced by Codex agent as a `git apply` to your local working tree [aliases: a]'
- name: resume
  description: Resume a previous interactive session (picker by default; use --last to continue the most recent)
- name: archive
  description: Archive a saved session by id or session name
- name: delete
  description: Permanently delete a saved session by id or session name
- name: unarchive
  description: Unarchive a saved session by id or session name
- name: fork
  description: Fork a previous interactive session (picker by default; use --last to fork the most recent)
- name: cloud
  description: '[EXPERIMENTAL] Browse tasks from Codex Cloud and apply changes locally'
- name: exec-server
  description: '[EXPERIMENTAL] Run the standalone exec-server service'
- name: features
  description: Inspect feature flags
- name: help
  description: Print this message or the help of the given subcommand(s)
arguments:
- name: '[PROMPT]'
  description: Optional user prompt to start the session
options:
- name: -c, --config <key=value>
  description: 'Override a configuration value that would otherwise be loaded from `~/.codex/config.toml`. Use a dotted path (`foo.bar.baz`) to override nested values. The `value` portion is parsed as TOML. If it fails to parse as TOML, the raw string is used as a literal. Examples: - `-c model="o3"` - `-c ''sandbox_permissions=["disk-full-read-access"]''` - `-c shell_environment_policy.inherit=all`'
- name: --enable <FEATURE>
  description: Enable a feature (repeatable). Equivalent to `-c features.<name>=true`
- name: --disable <FEATURE>
  description: Disable a feature (repeatable). Equivalent to `-c features.<name>=false`
- name: --remote <ADDR>
  description: 'Connect the TUI to a remote app server endpoint. Accepted forms: `ws://host:port`, `wss://host:port`, `unix://`, or `unix://PATH`.'
- name: --remote-auth-token-env <ENV_VAR>
  description: Name of the environment variable containing the bearer token to send to a remote app server websocket
- name: --strict-config
  description: Error out when config.toml contains fields that are not recognized by this version of Codex
- name: -i, --image <FILE>...
  description: Optional image(s) to attach to the initial prompt
- name: -m, --model <MODEL>
  description: Model the agent should use
- name: --oss
  description: Use open-source provider
- name: --local-provider <OSS_PROVIDER>
  description: Specify which local provider to use (lmstudio or ollama). If not specified with --oss, will use config default or show selection
- name: -p, --profile <CONFIG_PROFILE_V2>
  description: Layer $CODEX_HOME/<name>.config.toml on top of the base user config
- name: -s, --sandbox <SANDBOX_MODE>
  description: 'Select the sandbox policy to use when executing model-generated shell commands [possible values: read-only, workspace-write, danger-full-access]'
- name: --dangerously-bypass-approvals-and-sandbox
  description: Skip all confirmation prompts and execute commands without sandboxing. EXTREMELY DANGEROUS. Intended solely for running in environments that are externally sandboxed
- name: --dangerously-bypass-hook-trust
  description: Run enabled hooks without requiring persisted hook trust for this invocation. DANGEROUS. Intended only for automation that already vets hook sources
- name: -C, --cd <DIR>
  description: Tell the agent to use the specified directory as its working root
- name: --add-dir <DIR>
  description: Additional directories that should be writable alongside the primary workspace
- name: -a, --ask-for-approval <APPROVAL_POLICY>
  description: 'Configure when the model requires human approval before executing a command Possible values: - untrusted:  Only run "trusted" commands (e.g. ls, cat, sed) without asking for user approval. Will escalate to the user if the model proposes a command that is not in the "trusted" set - on-request: The model decides when to ask the user for approval - never:      Never ask for user approval Execution failures are immediately returned to the model'
- name: --search
  description: Enable live web search. When enabled, the native Responses `web_search` tool is available to the model (no per‑call approval)
- name: --no-alt-screen
  description: Disable alternate screen mode Runs the TUI in inline mode, preserving terminal scrollback history.
- name: -h, --help
  description: Print help (see a summary with '-h')
- name: -V, --version
  description: Print version
